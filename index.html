<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Simulation</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e2e7ee;--brand:#1f4e8c;--up:#0a8f5b;--down:#d1333f;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#e6ebf2;--mute:#8d99a9;--line:#2a3441;--brand:#5b9bf0;--up:#3ec48b;--down:#f06a74;--warn:#e0a63c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;color:var(--brand)}header .sp{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute);font:inherit}
nav button.on{background:var(--brand);color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}.card h3{font-size:13px;margin:14px 0 6px;color:var(--mute)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.g2,.g4{grid-template-columns:1fr 1fr}}@media(max-width:520px){.g2,.g4{grid-template-columns:1fr}}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px}th:first-child,td:first-child{text-align:left}
.tl th,.tl td{text-align:left}.scroll{overflow-x:auto}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}.warn{color:var(--warn)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%}
input[type=number]{width:110px}textarea{width:100%;min-height:90px}
button.b{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit}
button.b.s{padding:3px 10px;font-size:12px}button.b.r{background:var(--down)}button.b.g{background:var(--up)}button.b.o{background:none;color:var(--brand);border:1px solid var(--brand)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--line);color:var(--mute)}
.tag.ok{background:rgba(10,143,91,.15);color:var(--up)}.tag.bad{background:rgba(209,51,63,.15);color:var(--down)}.tag.wn{background:rgba(183,121,31,.18);color:var(--warn)}
.bar{height:14px;display:flex;border-radius:7px;overflow:hidden;background:var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.login{max-width:420px;margin:12vh auto}.err{color:var(--down);min-height:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:20;max-width:90vw}
.event{border-left:3px solid var(--warn);padding:6px 12px;background:rgba(183,121,31,.1);border-radius:4px;margin:6px 0}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
svg text{fill:var(--mute);font-size:11px}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm=(n,d=0)=>(n==null||isNaN(n))?"-":Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(n,d=2)=>(n==null||isNaN(n))?"-":(n*100).toFixed(d)+"%";
const sg=(n,d=2)=>`<span class="${n>=0?'up':'down'}">${n>=0?'+':''}${(n*100).toFixed(d)}%</span>`;
const COLORS={cash:"#8a94a3",stock:"#1f4e8c",gold:"#d4a017",bond:"#2a9d8f",loan:"#8e5bd1"};
let token=sessionStorage.getItem("tok")||"",ST=null,tab="",ui={};

async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Token":token},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:"服务器响应异常"}));
  if(r.status===401&&path!=="/api/login"){token="";sessionStorage.removeItem("tok");ST=null;render();throw new Error(j.error)}
  if(!r.ok)throw new Error(j.error||"错误");return j;
}
function toast(m,bad){const t=$("#toast");t.textContent=m;t.style.background=bad?"var(--down)":"";t.style.color=bad?"#fff":"";t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3500)}
async function act(path,body,ok){try{await api(path,body);if(ok)toast(ok);await refresh()}catch(e){toast(e.message,true)}}
async function refresh(){try{ST=await api("/api/state");render()}catch(e){if(token)toast(e.message,true)}}

function login(admin){
  const b=admin?{admin:1,password:$("#pw").value}:{code:$("#code").value,name:$("#nm").value};
  api("/api/login",b).then(r=>{token=r.token;sessionStorage.setItem("tok",token);tab="";return refresh()}).catch(e=>$("#err").textContent=e.message);
}
function renderLogin(){
  $("#app").innerHTML=`<div class="login card"><h2 style="font-size:18px">🏦 投资银行模拟交易</h2>
  <h3>小组登录</h3><div class="row"><input id="code" placeholder="小组口令" style="flex:1"><input id="nm" placeholder="你的姓名" style="flex:1"></div>
  <button class="b" onclick="login(false)">进入</button>
  <h3 style="margin-top:22px">老师/管理员</h3><div class="row"><input id="pw" type="password" placeholder="管理员密码" style="flex:1"><button class="b o" onclick="login(true)">管理员登录</button></div>
  <div class="err" id="err"></div></div>`;
}

/* ---------- charts ---------- */
function lineChart(series,w=560,h=200){
  const all=series.flatMap(s=>s.pts.map(p=>p[1]));if(!all.length)return"";
  let lo=Math.min(...all),hi=Math.max(...all);if(hi-lo<1e-9){lo-=1;hi+=1}const pad=(hi-lo)*.1;lo-=pad;hi+=pad;
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])),x0=Math.min(...xs),x1=Math.max(...xs,x0+1);
  const X=x=>40+(x-x0)/(x1-x0)*(w-50),Y=y=>10+(1-(y-lo)/(hi-lo))*(h-30);
  let g="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="40" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="36" y="${Y(v)+4}" text-anchor="end">${fm(v,Math.abs(hi)<10?2:0)}</text>`}
  for(let x=x0;x<=x1;x++)g+=`<text x="${X(x)}" y="${h-6}" text-anchor="middle">W${x}</text>`;
  const pal=["#1f4e8c","#d1333f","#0a8f5b","#d4a017","#8e5bd1","#2a9d8f","#e76f51","#6b7685"];
  series.forEach((s,i)=>{const c=s.color||pal[i%pal.length];g+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${s.pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`});
  const lg=series.length>1?`<div class="legend">${series.map((s,i)=>`<span><i style="background:${s.color||pal[i%pal.length]}"></i>${esc(s.name)}</span>`).join("")}</div>`:"";
  return`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${g}</svg>${lg}`;
}
function allocBar(a){
  const parts=[["cash","现金",a.cash],["stock","股票",a.stock],["gold","黄金",a.gold],["bond","国债",a.bond],["loan","应收贷款",a.recv]];
  const tot=parts.reduce((s,p)=>s+Math.max(p[2],0),0)||1;
  return`<div class="bar">${parts.map(p=>`<div style="width:${Math.max(p[2],0)/tot*100}%;background:${COLORS[p[0]]}" title="${p[1]}"></div>`).join("")}</div>
  <div class="legend">${parts.map(p=>`<span><i style="background:${COLORS[p[0]]}"></i>${p[1]} ${pc(p[2]/Math.max(a.nav,1)*1,1)}</span>`).join("")}</div>`;
}

/* ---------- shared ---------- */
function boardTable(){
  const b=ST.board;if(!b.length)return`<p class="mute">第一次结算后显示排行榜。</p>`;
  const me=ST.me?.id;
  return`<div class="scroll"><table><tr><th>排名</th><th>小组</th><th>净资产</th><th>收益率</th><th>最大回撤</th><th>周波动</th><th>违约</th><th>强平</th><th>会计分</th><th>综合评分</th></tr>
  ${b.map(r=>`<tr ${r.id===me?'style="font-weight:600"':''}><td>${r.rank}</td><td>${esc(r.name)}</td><td>${fm(r.nav)}</td><td>${sg(r.ret)}</td><td>${pc(r.mdd)}</td><td>${pc(r.vol)}</td><td>${r.defaults}</td><td>${r.forced}</td><td>${ST.config.accounting_enabled?fm(r.s_accounting,1):"-"}</td><td>${fm(r.score,1)}</td></tr>`).join("")}</table></div>
  <p class="mute" style="font-size:12px">综合评分 = 收益率${ST.config.w_ret}% + 风险控制${ST.config.w_risk}%(回撤+波动) + 流动性${ST.config.w_liq}% + 信用${ST.config.w_credit}% + 报告${ST.config.w_report}%${ST.config.accounting_enabled?" + 会计作业"+ST.config.w_accounting+"%":""}。收益率得分按各组相对高低线性映射。</p>`;
}
function events(){return ST.events.length?ST.events.slice().sort((a,b)=>b.week-a.week).map(e=>`<div class="event"><b>第${e.week}周事件</b>：${esc(e.text)}</div>`).join(""):""}
function lastPrice(id){const ws=Object.keys(ST.prices).map(Number).sort((a,b)=>a-b);for(let i=ws.length-1;i>=0;i--){const p=ST.prices[ws[i]][id];if(p)return p}return 0}
function prevPrice(id){const ws=Object.keys(ST.prices).map(Number).sort((a,b)=>b-a);let n=0;for(const w of ws){const p=ST.prices[w][id];if(p){if(n++===1)return p}}return null}
function weekBadge(){return ST.finished?`<span class="tag bad">已结束</span>`:`<span class="tag ok">第 ${ST.week} / ${ST.config.total_weeks} 周 · 交易进行中</span>`}

/* ---------- team ---------- */
const TEAM_TABS=[["dash","总览"],["trade","交易"],["loans","同业拆借"],["report","投资报告"],["accounting","会计结账"],["board","排行榜"]];
function teamView(){
  const m=ST.me,a=m.acct,c=ST.config;if(!tab)tab="dash";
  let h="";
  if(tab==="dash"){
    const init=m.hist[0]?.nav||c.initial_cash;
    h=events()+`<div class="grid g4"><div class="card kpi"><div class="l">净资产</div><div class="v">${fm(a.nav)}</div></div>
    <div class="card kpi"><div class="l">累计收益率</div><div class="v">${sg(a.nav/init-1)}</div></div>
    <div class="card kpi"><div class="l">现金（占比 ${pc(a.cash/a.nav,1)}）</div><div class="v">${fm(a.cash)}</div></div>
    <div class="card kpi"><div class="l">应收 / 应付贷款</div><div class="v" style="font-size:16px">${fm(a.recv)} / ${fm(a.pay)}</div></div></div>
    <div class="grid g2"><div class="card"><h2>资产配置</h2>${allocBar(a)}</div>
    <div class="card"><h2>净资产走势</h2>${lineChart([{name:"净资产",pts:m.hist.map(x=>[x.week,x.nav])}])}</div></div>
    <div class="card"><h2>当前持仓</h2>${holdingsTable(m)}</div>`;
  }
  if(tab==="trade")h=tradeView(m);
  if(tab==="loans")h=loansView(m);
  if(tab==="report"){const r=m.reports[ST.week]||{};
    h=events()+`<div class="card"><h2>第 ${ST.week} 周投资说明</h2><p class="mute">建议 100–300 字：投资逻辑、宏观判断、买卖理由、风险点、下周计划。</p>
    <textarea id="rep">${esc(r.text||"")}</textarea><div class="row"><button class="b" onclick="act('/api/report',{text:$('#rep').value},'已保存')">保存</button></div></div>
    <div class="card"><h2>历史报告与评分</h2>${Object.keys(m.reports).sort((a,b)=>b-a).map(w=>{const r=m.reports[w];return`<h3>第${w}周 ${r.grade!=null?`<span class="tag ok">${r.grade} 分</span>`:""}</h3><div>${esc(r.text||"(未提交)")}</div>${r.comment?`<div class="mute">老师评语：${esc(r.comment)}</div>`:""}`}).join("")||'<p class="mute">暂无</p>'}</div>`}
  if(tab==="accounting")h=accountingView(m);
  if(tab==="board")h=`<div class="card"><h2>排行榜</h2>${boardTable()}</div>`;
  return h;
}
function holdingsTable(m){
  const am=Object.fromEntries(ST.assets.map(a=>[a.id,a]));
  const rows=Object.entries(m.holdings).filter(([k,q])=>q>0&&am[k]);
  if(!rows.length)return`<p class="mute">暂无持仓。</p>`;
  const nav=m.acct.nav;
  return`<div class="scroll"><table><tr><th>资产</th><th>数量</th><th>成本价</th><th>最新价</th><th>市值</th><th>占净资产</th><th>浮动盈亏</th></tr>
  ${rows.map(([k,q])=>{const p=lastPrice(k),cost=m.cost[k]||p;return`<tr><td>${esc(am[k].name)}</td><td>${fm(q)}</td><td>${fm(cost,2)}</td><td>${fm(p,2)}</td><td>${fm(q*p)}</td><td>${pc(q*p/nav,1)}</td><td>${sg(p/cost-1)}</td></tr>`}).join("")}</table></div>`;
}
function pendingOrders(m){return m.orders.filter(o=>o.week===ST.week&&o.status==="pending")}
function tradeView(m){
  const c=ST.config,am=Object.fromEntries(ST.assets.map(a=>[a.id,a]));
  const pend=pendingOrders(m);
  const lastSettled=m.orders.filter(o=>o.status!=="pending").slice(-15).reverse();
  const q=(ui.q||"").toLowerCase();
  const list=ST.assets.filter(a=>a.enabled&&(!q||(a.name+a.id+a.sector).toLowerCase().includes(q)));
  return`${events()}<div class="card"><h2>下单 ${weekBadge()}</h2>
  <p class="mute">本周订单将在老师结算时，按<b>第 ${ST.week} 周收盘价</b>成交（目前看到的是第 ${ST.week-1} 周价格）。先执行卖出，再执行买入；手续费 ${pc(c.fee_rate,2)}。
  限制：单只股票 ≤ ${pc(c.max_single,0)}，股票总仓位 ≤ ${pc(c.max_stock_total,0)}，黄金 ≤ ${pc(c.max_gold,0)}，国债 ≤ ${pc(c.max_bond,0)}，现金 ≥ ${pc(c.min_cash,0)}。违规订单会被拒绝。</p>
  <div class="row"><input placeholder="搜索 代码/名称/行业" value="${esc(ui.q||"")}" oninput="ui.q=this.value;render(true)" id="srch"><span class="mute">可用现金 ${fm(m.cash)}</span></div>
  <div class="scroll"><table><tr><th>资产</th><th>行业</th><th>最新价</th><th>周涨跌</th><th>持仓</th><th>数量</th><th></th></tr>
  ${list.map(a=>{const p=lastPrice(a.id),pp=prevPrice(a.id);return`<tr><td>${esc(a.name)} <span class="mute">${esc(a.id)}</span></td><td>${esc(a.sector)}</td><td>${fm(p,2)}</td><td>${pp?sg(p/pp-1):"-"}</td><td>${fm(m.holdings[a.id]||0)}</td>
  <td><input type="number" min="1" step="1" id="q_${a.id.replace(/\W/g,'_')}" placeholder="股数"></td>
  <td><button class="b s g" ${ST.finished?"disabled":""} onclick="order('${a.id}','buy')">买</button> <button class="b s r" ${ST.finished?"disabled":""} onclick="order('${a.id}','sell')">卖</button></td></tr>`}).join("")}</table></div></div>
  <div class="card"><h2>本周待执行订单</h2>${pend.length?`<table class="tl"><tr><th>资产</th><th>方向</th><th>数量</th><th>预估金额</th><th></th></tr>${pend.map(o=>`<tr><td>${esc(am[o.asset]?.name||o.asset)}</td><td>${o.side==="buy"?"买入":"卖出"}</td><td>${fm(o.qty)}</td><td>${fm(o.qty*lastPrice(o.asset))}</td><td><button class="b s o" onclick="act('/api/order/cancel',{id:'${o.id}'})">撤销</button></td></tr>`).join("")}</table>`:'<p class="mute">暂无</p>'}</div>
  <div class="card"><h2>最近成交记录</h2>${lastSettled.length?`<div class="scroll"><table class="tl"><tr><th>周</th><th>资产</th><th>方向</th><th>数量</th><th>成交价</th><th>手续费</th><th>状态</th></tr>${lastSettled.map(o=>`<tr><td>${o.week}</td><td>${esc(am[o.asset]?.name||o.asset)}</td><td>${o.side==="buy"?"买入":"卖出"}</td><td>${fm(o.qty)}</td><td>${o.price?fm(o.price,2):"-"}</td><td>${o.fee?fm(o.fee):"-"}</td><td>${o.status==="filled"?'<span class="tag ok">成交</span>':`<span class="tag bad">拒绝</span> ${esc(o.note||"")}`}</td></tr>`).join("")}</table></div>`:'<p class="mute">暂无</p>'}</div>`;
}
function order(id,side){
  const el=document.getElementById("q_"+id.replace(/\W/g,"_")),qty=parseInt(el.value);
  if(!qty||qty<1)return toast("请输入股数",true);
  act("/api/order",{asset:id,side,qty},"订单已提交");
}
function loansView(m){
  const c=ST.config,names=ST.team_names,others=Object.entries(names).filter(([id])=>id!==m.id);
  const L=m.loans,pend=L.filter(l=>l.status==="pending");
  const incoming=pend.filter(l=>l.proposer!==m.id),outgoing=pend.filter(l=>l.proposer===m.id);
  const act_=L.filter(l=>l.status==="active");
  const desc=l=>`${esc(names[l.lender])} → ${esc(names[l.borrower])}`;
  return`<div class="card"><h2>发起借贷</h2>
  <p class="mute">对方确认后立即划款，到期（第 N 周结算时）自动还本付息。利率 ${pc(c.rate_min,0)}–${pc(c.rate_max,0)}，期限 ${c.durations.join("/")} 周。借款方总负债 ≤ 净资产 ${pc(c.debt_max,0)}；单一对手方 ≤ 出借方净资产 ${pc(c.cp_max,0)}；总放贷 ≤ ${pc(c.lend_max,0)}。</p>
  <div class="row"><label class="f">我要<select id="ln_mode"><option value="borrow">借入</option><option value="lend">借出</option></select></label>
  <label class="f">对手方<select id="ln_cp">${others.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join("")}</select></label>
  <label class="f">金额 HKD<input type="number" id="ln_p" value="10000000" step="1000000"></label>
  <label class="f">年化利率 %<input type="number" id="ln_r" value="8" step="0.5"></label>
  <label class="f">期限(周)<select id="ln_w">${c.durations.map(d=>`<option>${d}</option>`).join("")}</select></label>
  <button class="b" onclick="propose()">发送申请</button></div></div>
  <div class="card"><h2>待我确认</h2>${incoming.length?`<table class="tl"><tr><th>方向</th><th>金额</th><th>年化</th><th>期限</th><th>应还利息</th><th></th></tr>${incoming.map(l=>`<tr><td>${desc(l)}</td><td>${fm(l.principal)}</td><td>${pc(l.rate)}</td><td>${l.weeks}周</td><td>${fm(l.principal*l.rate*l.weeks/52)}</td><td><button class="b s g" onclick="act('/api/loan/respond',{id:'${l.id}',action:'accept'},'贷款已生效')">接受</button> <button class="b s r" onclick="act('/api/loan/respond',{id:'${l.id}',action:'reject'})">拒绝</button></td></tr>`).join("")}</table>`:'<p class="mute">暂无</p>'}
  ${outgoing.length?`<h3>我发出的申请（等待对方）</h3><table class="tl">${outgoing.map(l=>`<tr><td>${desc(l)}</td><td>${fm(l.principal)}</td><td>${pc(l.rate)}</td><td>${l.weeks}周</td><td><button class="b s o" onclick="act('/api/loan/respond',{id:'${l.id}',action:'cancel'})">撤销</button></td></tr>`).join("")}</table>`:""}</div>

function accountingView(m){
  const ws=m.hist.filter(x=>x.week>=1).map(x=>x.week);
  if(!ws.length)return`<div class="card"><h2>会计结账</h2><p class="mute">老师完成第一次结算后，这里会出现第 1 周的会计作业。</p></div>`;
  const first=ws.find(x=>m.accounting[x]?.status!=="submitted");
  const w=ui.axw??(first??ws[ws.length-1]);
  const head=`<div class="card"><h2>会计结账</h2><p class="mute">你负责<b>会计判断</b>（分类、减值、信用损失），系统负责记账和出报表。必须按周顺序完成；老师评分后不能再改。</p>
  <div class="row"><label class="f">周次<select onchange="ui.axw=+this.value;ui.ax=null;render()">${ws.map(x=>`<option value="${x}" ${x==w?"selected":""}>第${x}周</option>`).join("")}</select></label>${AX_STATUS(m.accounting[w])}</div></div>`;
  if(!ui.ax||ui.ax.week!==w){loadAcct(w);return head+`<div class="card mute">加载中…</div>`}
  const X=ui.ax;if(X.loading)return head+`<div class="card mute">加载中…</div>`;
  if(X.err&&!X.res)return head+`<div class="card warn">${esc(X.err)}</div>`;
  const rec=X.rec||{},ro=rec.grade!=null,ctx=X.res.ctx,dv=(k,id,f)=>X.dec?.[k]?.[id]?.[f];
  const dis=ro?"disabled":"";
  const cls=ctx.assets.map(a=>{const cur=dv("classes",a.id,"cls")||a.cls;
    return`<tr><td>${esc(a.name)}</td><td>${fm(a.qty_open)}</td><td>${fm(a.bought)} / ${fm(a.sold)}</td><td>${fm(a.qty)}</td>
    <td>${a.locked?`<span class="tag">${a.cls} 沿用</span>`:`<select ${dis} data-ax="classes" data-id="${a.id}" data-f="cls" onchange="axSync()">${Object.entries(ctx.classes).map(([k,n])=>`<option value="${k}" ${k===cur?"selected":""}>${esc(n)}${a.allowed.includes(k)?"":"（通常不适用）"}</option>`).join("")}</select>`}</td>
    <td>${a.locked?"":`<input ${dis} data-ax="classes" data-id="${a.id}" data-f="reason" value="${esc(dv("classes",a.id,"reason")||"")}" placeholder="分类理由/持有意图" oninput="axSync()" style="width:200px">`}</td></tr>`}).join("");
  const imp=ctx.assets.filter(a=>a.qty>0).map(a=>`<tr><td>${esc(a.name)} <span class="tag">${a.cls}</span></td><td>${fm(a.cost)}</td><td>${fm(a.mv)}</td><td>${sgAmt(a.unrealized)}</td>
    <td><input ${dis} type="number" min="0" data-ax="impair" data-id="${a.id}" data-f="amount" value="${dv("impair",a.id,"amount")??""}" oninput="axSync()"></td>
    <td><input ${dis} data-ax="impair" data-id="${a.id}" data-f="reason" value="${esc(dv("impair",a.id,"reason")||"")}" placeholder="减值/跌价依据" oninput="axSync()" style="width:200px"></td></tr>`).join("");
  const ecl=ctx.loans.map(l=>`<tr><td>${esc(l.cp)} <span class="mute">${l.id}</span></td><td>${fm(l.principal)}</td><td>${pc(l.rate)}</td><td>第${l.due}周</td><td>${fm(l.allow)}</td>
    <td><input ${dis} type="number" min="0" data-ax="ecl" data-id="${l.id}" data-f="amount" value="${dv("ecl",l.id,"amount")??""}" oninput="axSync()"></td>
    <td><input ${dis} data-ax="ecl" data-id="${l.id}" data-f="reason" value="${esc(dv("ecl",l.id,"reason")||"")}" placeholder="信用风险判断依据" oninput="axSync()" style="width:200px"></td></tr>`).join("");
  return head+(rec.comment?`<div class="event"><b>老师评语</b>：${esc(rec.comment)}</div>`:"")+`
  <div class="card"><h2>一、投资分类</h2><p class="mute">新买入的资产需要选择会计分类并说明持有意图；已分类的资产沿用，不得随意重分类。</p>
  <div class="scroll"><table class="tl"><tr><th>资产</th><th>期初</th><th>本周买/卖</th><th>期末</th><th>分类</th><th>理由</th></tr>${cls||'<tr><td colspan=6 class="mute">无投资</td></tr>'}</table></div></div>
  <div class="card"><h2>二、减值 / 跌价准备</h2><p class="mute">仅对 AC（减值准备）、FVOCI（损失转入损益）、存货（跌价准备）有效；FVTPL 的下跌已通过公允价值变动入账。不计提请留空。</p>
  <div class="scroll"><table class="tl"><tr><th>资产</th><th>成本(扣准备)</th><th>市值</th><th>未实现损益</th><th>计提金额</th><th>理由</th></tr>${imp||'<tr><td colspan=6 class="mute">无持仓</td></tr>'}</table></div></div>
  <div class="card"><h2>三、贷款预期信用损失（放款方）</h2>
  <div class="scroll"><table class="tl"><tr><th>对手方</th><th>本金</th><th>年化</th><th>到期</th><th>已计提</th><th>本次追加</th><th>依据</th></tr>${ecl||'<tr><td colspan=7 class="mute">本周末没有未到期的放款</td></tr>'}</table></div></div>
  <div class="card"><h2>四、会计说明与提交</h2><textarea ${dis} id="axnotes" oninput="ui.ax.notes=this.value" placeholder="说明本周主要会计判断：为什么这样分类、为什么计提/不计提、信用风险判断…">${esc(X.notes??rec.notes??"")}</textarea>
  <div class="row"><button class="b o" onclick="axPreview()" ${dis}>预览分录和报表</button><button class="b" onclick="axSubmit()" ${dis}>${rec.status==="submitted"?"重新提交":"提交会计结账"}</button>${rec.submitted_by?`<span class="mute">上次提交：${esc(rec.submitted_by)}</span>`:""}</div></div>`+resultHtml(X.res);
}
function sgAmt(v){return`<span class="${v>=0?'up':'down'}">${v>=0?'+':''}${fm(v)}</span>`}
async function loadAcct(w){
  ui.ax={week:w,loading:true};
  try{
    const rec=await api("/api/accounting/get",{week:w});
    const dec=rec.decisions||{};let res=null,err=null;
    try{res=await api("/api/accounting/preview",{week:w,decisions:dec})}catch(e){err=e.message}
    ui.ax={week:w,rec,dec,res,err,notes:rec.notes};
  }catch(e){ui.ax={week:w,err:e.message}}
  render();
}
function axCollect(){const d={classes:{},impair:{},ecl:{}};
  document.querySelectorAll("[data-ax]").forEach(e=>{const t=d[e.dataset.ax];(t[e.dataset.id]=t[e.dataset.id]||{})[e.dataset.f]=e.value});return d}
function axSync(){ui.ax.dec=axCollect()}
async function axPreview(){axSync();try{ui.ax.res=await api("/api/accounting/preview",{week:ui.ax.week,decisions:ui.ax.dec});render();toast("预览已更新，向下查看分录和报表")}catch(e){toast(e.message,true)}}
async function axSubmit(){axSync();try{await api("/api/accounting/submit",{week:ui.ax.week,decisions:ui.ax.dec,notes:$("#axnotes").value});toast("会计结账已提交");ui.ax=null;await refresh()}catch(e){toast(e.message,true)}}

function accountingAdmin(){
  const T=Object.values(ST.teams),n=ST.config.total_weeks,settled=ST.finished?n:ST.week-1;
  if(settled<1)return`<div class="card"><h2>会计作业</h2><p class="mute">完成第一次结算后，这里显示各组提交情况。</p></div>`;
  const ws=Array.from({length:settled},(_,i)=>i+1);
  let h=`<div class="card"><h2>会计作业提交状态 <span class="mute" style="font-weight:400">（点击单元格查看/评分）</span></h2><div class="scroll"><table><tr><th>小组</th>${ws.map(w=>`<th>第${w}周</th>`).join("")}<th>平均分</th></tr>
  ${T.map(t=>{const gs=Object.values(t.accounting).map(r=>r.grade).filter(g=>g!=null);return`<tr><td>${esc(t.name)}</td>${ws.map(w=>`<td style="cursor:pointer" onclick="aaOpen('${t.id}',${w})">${AX_STATUS(t.accounting[w])}</td>`).join("")}<td>${gs.length?fm(gs.reduce((a,b)=>a+b,0)/gs.length,1):"-"}</td></tr>`}).join("")}</table></div></div>`;
  const A=ui.aa;if(!A)return h;
  const t=ST.teams[A.team];if(!t)return h;
  if(A.loading||!A.data)return h+`<div class="card mute">加载中…</div>`;
  const r=A.data,d=r.decisions||{};
  const dt=(k,cols)=>{const rows=Object.entries(d[k]||{}).filter(([,v])=>v&&(v.cls||v.amount>0||v.reason));return rows.length?`<table class="tl"><tr><th>${cols}</th><th>选择/金额</th><th>理由</th></tr>${rows.map(([id,v])=>`<tr><td>${esc(k==="ecl"?id:assetName(id))}</td><td>${esc(v.cls??v.amount??"")}</td><td style="white-space:normal">${esc(v.reason||"")}</td></tr>`).join("")}</table>`:'<p class="mute">无</p>'};
  const res=r.journals?{journals:r.journals,statements:r.statements,warnings:r.warnings||[],ctx:{week:A.week}}:null;
  return h+`<div class="card"><h2>${esc(t.name)} · 第 ${A.week} 周 ${AX_STATUS(r.status?r:null)}</h2>${!r.status?'<p class="mute">该组尚未提交。</p>':`<p class="mute">提交人：${esc(r.submitted_by||"-")}</p>
  <h3>投资分类</h3>${dt("classes","资产")}<h3>减值/跌价准备</h3>${dt("impair","资产")}<h3>贷款信用损失</h3>${dt("ecl","贷款")}
  <h3>会计说明</h3><div style="white-space:pre-wrap">${esc(r.notes||"(空)")}</div>
  <div class="row" style="margin-top:12px"><input type="number" id="aa_g" min="0" max="100" placeholder="0-100" value="${r.grade??""}" style="width:90px"><input id="aa_c" placeholder="评语" value="${esc(r.comment||"")}" style="flex:1">
  <button class="b" onclick="aaGrade(false)" ${r.journals?"":"disabled"}>保存评分</button><button class="b r" onclick="if(confirm('退回后学生需重新提交，已有评分将清除。确认？'))aaGrade(true)">退回修改</button></div>`}</div>`+(res?resultHtml(res):"");
}
async function aaOpen(team,week){ui.aa={team,week,loading:true};render();
  try{const data=await api("/api/accounting/get",{team,week});ui.aa={team,week,data}}catch(e){toast(e.message,true);ui.aa=null}render()}
async function aaGrade(ret){const A=ui.aa;
  try{await api("/api/admin/accounting/grade",{team:A.team,week:A.week,grade:$("#aa_g").value,comment:$("#aa_c").value,action:ret?"return":""});toast(ret?"已退回":"已保存");await refresh();aaOpen(A.team,A.week)}catch(e){toast(e.message,true)}}

/* ---------- shell ---------- */
function render(keepFocus){
  if(!token||!ST)return renderLogin();
  const adm=ST.role==="admin",tabs=(adm?ADMIN_TABS:TEAM_TABS).filter(t=>ST.config.accounting_enabled||!["accounting","acct"].includes(t[0]));
  if(!tab)tab=tabs[0][0];
  const ae=document.activeElement,fid=ae&&ae.id,pos=ae&&ae.selectionStart;
  $("#app").innerHTML=`<header><h1>🏦 ${esc(ST.config.title)}</h1><nav>${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join("")}</nav><span class="sp"></span>
  ${weekBadge()}<span class="mute">${adm?"管理员":esc(ST.me.name)+" · "+esc(ST.user)}</span><button class="b s o" onclick="refresh()">刷新</button><button class="b s o" onclick="token='';sessionStorage.removeItem('tok');ST=null;tab='';render()">退出</button></header>
  <main>${adm?adminView():teamView()}</main>`;
  if(keepFocus&&fid){const e=document.getElementById(fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch{}}}
}
setInterval(()=>{const a=document.activeElement;if(token&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))refresh()},15000);
token?refresh():render();
</script>
</body>
</html>
