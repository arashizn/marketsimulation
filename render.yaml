services:
  - type: web
    name: market-simulation
    runtime: python
    plan: starter            # 使用文件存储时需要付费实例(持久化磁盘); 改用 DATABASE_URL 后可以用 free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false          # 在 Render 控制台手动填写, 不要写进仓库
      - key: DATABASE_URL  # 可选: 填 PostgreSQL 连接串后改用数据库存储, 此时可去掉下面的 disk
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: simdata
      mountPath: /var/data
      sizeGB: 1
